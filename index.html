<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Tasks</title>
<style>
:root{--bg:#eef1fa;--ink:#161d3a;--mute:#5a6486;--card:#ffffff;--line:#d9def0;--tint:#e4e8fb;--acc:#3b4fe0;--accInk:#ffffff;--hot:#ff6a45;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 100px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Avenir Next","Segoe UI",system-ui,sans-serif;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
main{max-width:480px;margin:0 auto;padding:20px 16px 48px}
h1{font-family:Georgia,"Times New Roman",serif;font-size:2.1rem;margin:0;letter-spacing:-.01em}
h2{font-family:Georgia,serif;font-size:1.25rem;margin:26px 0 10px}
.sub{color:var(--mute);margin:2px 0 16px}
.strip{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 6px;text-align:center}
.stat b{display:block;font-size:1.35rem;font-family:Georgia,serif}
.stat span{color:var(--mute);font-size:.78rem}
.timer{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:14px;background:var(--acc);color:var(--accInk);border-radius:22px;padding:12px 16px;box-shadow:0 8px 24px rgba(30,40,120,.22)}
.timer.done{background:var(--hot);color:#fff}
.ringw{position:relative;width:76px;height:76px;flex:none}
.ringw svg{width:100%;height:100%}
.rb{fill:none;stroke:rgba(255,255,255,.28);stroke-width:6}
.rf{fill:none;stroke:currentColor;stroke-width:6;stroke-linecap:round;stroke-dasharray:201.06;stroke-dashoffset:201.06;transition:stroke-dashoffset .25s linear}
.ringw span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:Georgia,serif;font-size:1.25rem;font-variant-numeric:tabular-nums}
.tr{flex:1;min-width:0}
.name{font-weight:700;min-height:1.4em;margin-bottom:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btns{display:flex;gap:8px}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:8px 16px;font-weight:700}
button:focus-visible,input:focus-visible{outline:3px solid var(--hot);outline-offset:2px}
.timer button{background:var(--accInk);color:var(--acc)}
.timer.done button{color:var(--hot)}
.timer button.ghost{background:transparent;color:inherit;border:1px solid currentColor}
ul{list-style:none;margin:0;padding:0;display:grid;gap:14px}
li{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px}
li.done{opacity:.7}
li.done .t b{text-decoration:line-through}
.row{display:flex;align-items:center;gap:12px}
.row input{width:26px;height:26px;accent-color:var(--acc);flex:none}
.t{flex:1;min-width:0}
.t small{display:block;color:var(--mute)}
.go{background:var(--acc);color:var(--accInk);padding:8px 14px;flex:none}
svg.fig{display:block;width:100%;height:auto;margin-top:10px;background:var(--tint);border-radius:14px}
.fig line{stroke:var(--ink);stroke-width:4;stroke-linecap:round}
.fig circle{fill:var(--card);stroke:var(--acc);stroke-width:3.5}
.fig .fl{stroke:var(--line);stroke-width:2}
.fig .wl{stroke:var(--mute);stroke-width:3}
.fig .ar{fill:var(--acc)}
.fig text{fill:var(--mute);font-size:7px;font-family:inherit}
.hint{color:var(--mute);margin:0 0 10px}
.more{display:block;width:100%;margin-top:12px;background:transparent;color:var(--acc);border:2px dashed var(--acc);padding:12px}
.more[hidden]{display:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-top:26px}
.card h2{margin-top:0}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{background:var(--tint);color:var(--mute);padding:6px 14px}
.tabs button[aria-pressed="true"]{background:var(--acc);color:var(--accInk)}
.sum{margin:0 0 12px}
.chart{display:flex;align-items:flex-end;gap:3px;height:112px}
.col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.bar{width:100%;max-width:28px;border-radius:5px 5px 2px 2px;background:var(--line)}
.bar.has{background:var(--acc)}
.bar.now{background:var(--hot)}
.col span{font-size:.7rem;color:var(--mute);height:16px;line-height:16px}
.reset{display:block;margin:22px auto 0;background:none;color:var(--mute);text-decoration:underline;font-weight:400}
.ov{position:fixed;inset:0;z-index:20;background:rgba(10,14,40,.62);display:flex;align-items:center;justify-content:center;padding:20px;overflow:hidden}
.ov[hidden]{display:none}
.pop{position:relative;background:var(--card);border-radius:24px;padding:26px 22px;max-width:340px;width:100%;text-align:center;animation:pop .35s ease-out}
.pop .big{font-size:3rem}
.pop h2{margin:4px 0 6px;font-size:1.7rem}
.pop p{color:var(--mute);margin:0 0 18px}
.pop button{display:block;width:100%;margin-top:8px;padding:12px;background:var(--acc);color:var(--accInk)}
.pop button.g{background:transparent;color:var(--mute);font-weight:400}
.conf span{position:absolute;top:-20px;width:9px;height:15px;border-radius:2px;animation:fall 2.6s linear forwards}
.bgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bd{text-align:center;padding:10px 4px;border-radius:14px;background:var(--tint)}
.bd i{display:flex;width:54px;height:54px;margin:0 auto 4px;border-radius:50%;background:linear-gradient(135deg,#ffd35a,#ff9d3c);align-items:center;justify-content:center;font-style:normal;font-size:1.7rem}
.bd.lock i{background:var(--line);filter:grayscale(1);opacity:.55}
.bd b{display:block;font-size:.82rem}
.bd small{display:block;color:var(--mute);font-size:.72rem}
.share{display:block;width:100%;margin-top:14px;background:var(--acc);color:var(--accInk);padding:12px}
.pop{max-height:calc(100% - 8px);overflow:auto}
.pop canvas{width:100%;height:auto;border-radius:14px;display:block;margin-bottom:6px}
.pop button.s{background:var(--tint);color:var(--ink)}
.pop .badge{width:96px;height:96px;margin:0 auto 6px;border-radius:50%;background:linear-gradient(135deg,#ffd35a,#ff9d3c);display:flex;align-items:center;justify-content:center;font-size:3.2rem;box-shadow:0 6px 18px rgba(255,157,60,.45)}
.nb{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:0 0 12px}
.nb span{background:var(--tint);border-radius:999px;padding:4px 10px;font-size:.85rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;z-index:30;font-weight:700;white-space:nowrap}
.toast[hidden]{display:none}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.rf{transition:none}.conf{display:none}.pop{animation:none}}

:root{--h1:#3b4fe0;--h2:#7a3de0}
main{padding-bottom:150px}
.hero{display:flex;align-items:center;justify-content:space-between;gap:12px;background:linear-gradient(135deg,var(--h1),var(--h2));color:#fff;border-radius:26px;padding:20px 18px;margin-bottom:14px;box-shadow:0 12px 30px rgba(59,79,224,.28)}
.hero h1{color:#fff}.hero .sub{color:rgba(255,255,255,.82);margin:2px 0 10px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:rgba(255,255,255,.18);border-radius:999px;padding:3px 10px;font-size:.82rem}
.chip b{font-family:Georgia,serif}
.hr{position:relative;width:86px;height:86px;flex:none}
.hr svg{width:100%;height:100%}
.hr .rb{stroke:rgba(255,255,255,.25);stroke-width:7}
.hf{fill:none;stroke:#fff;stroke-width:7;stroke-linecap:round;stroke-dasharray:213.63;stroke-dashoffset:213.63;transition:stroke-dashoffset .4s}
.hr span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:Georgia,serif;font-size:1.35rem;font-weight:700}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--tint);padding:4px;border-radius:15px}
.seg.two{grid-template-columns:1fr 1fr;margin-bottom:14px}
.seg button{background:transparent;color:var(--mute);padding:9px 4px;border-radius:11px}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 2px 8px rgba(20,30,90,.16)}
.seg button:disabled{opacity:.45;cursor:not-allowed}
#lv button::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:#2dbf8a}
#lv button[data-l="medium"]::before{background:#ffb02e}
#lv button[data-l="hard"]::before{background:var(--hot)}
.lvbox{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;margin-bottom:6px}
.lvh{font-weight:700;margin-bottom:8px}
.lvbox .hint{margin:8px 2px 0;font-size:.9rem}
li{border-radius:20px;box-shadow:0 4px 14px rgba(30,40,110,.07)}
.row input{appearance:none;-webkit-appearance:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-content:center;background:var(--card);flex:none;cursor:pointer}
.row input:checked{background:var(--acc);border-color:var(--acc)}
.row input:checked::after{content:"✓";color:var(--accInk);font-weight:700;font-size:1rem}
.t b{font-size:1.08rem}
.tags{display:flex;gap:6px;margin-top:3px}
.tag{font-size:.72rem;background:var(--tint);color:var(--mute);padding:2px 9px;border-radius:999px}
.how{margin:10px 2px 0;color:var(--mute);font-size:.92rem}
.timer{position:fixed;top:auto;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 24px rgba(30,40,120,.25)}
.ringw{width:60px;height:60px}.ringw span{font-size:1rem}
.toast{bottom:calc(110px + env(safe-area-inset-bottom,0px))}
@media (prefers-reduced-motion:reduce){.hf{transition:none}}


main{padding-bottom:100px}
.toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
button{transition:transform .12s}
button:active{transform:scale(.96)}
.bnav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;z-index:8;display:grid;grid-template-columns:1fr 1fr;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.bnav button{background:transparent;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:0;font-size:.8rem;padding:6px}
.bnav button span{font-size:1.35rem;line-height:1.2}
.bnav button[aria-pressed="true"]{color:var(--acc)}
li .go{background:linear-gradient(135deg,var(--h1),var(--h2));color:#fff;padding:10px 16px;border-radius:14px;box-shadow:0 4px 12px rgba(59,79,224,.3)}
li svg.fig.mf{width:min(100%,190px);height:auto;aspect-ratio:1;margin:10px auto 0}
li.done{opacity:.65}
.stage{position:fixed;inset:0;z-index:25;background:linear-gradient(160deg,var(--h1),var(--h2) 70%,#1a1050);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:10px;padding:calc(14px + env(safe-area-inset-top,0px)) 20px calc(22px + env(safe-area-inset-bottom,0px));text-align:center;animation:rise .3s ease-out}
.stage[hidden]{display:none}
.stage.done{background:linear-gradient(160deg,#16a06b,#0b6b52)}
.sTop{width:100%;max-width:480px;display:flex;justify-content:space-between}
.sTop button{background:rgba(255,255,255,.18);color:#fff;border-radius:999px;padding:8px 14px}
.sName{font-family:Georgia,serif;font-size:1.7rem;margin:0}
.sHow{opacity:.85;max-width:340px;margin:4px auto 0;font-size:.95rem}
.sFig{height:clamp(120px,24vh,210px);aspect-ratio:1}
.sFig svg.fig{width:100%;height:100%;background:rgba(255,255,255,.14);margin:0}
.stage .fig line{stroke:#fff}
.stage .fig circle{fill:transparent;stroke:#fff}
.stage .fig .fl{stroke:rgba(255,255,255,.3)}
.sRingW{position:relative;width:clamp(190px,36vh,290px);aspect-ratio:1}
.sRingW svg{width:100%;height:100%}
.sb{fill:none;stroke:rgba(255,255,255,.22);stroke-width:12}
.sf{fill:none;stroke:#fff;stroke-width:12;stroke-linecap:round;stroke-dasharray:741.42;stroke-dashoffset:0;transition:stroke-dashoffset 1s linear}
#sTime{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:Georgia,serif;font-size:clamp(3.4rem,11vh,5.6rem);font-weight:700;font-variant-numeric:tabular-nums}
.stage.last #sTime{animation:pulse 1s ease-in-out infinite}
.sGo{background:#fff;color:var(--h1);font-size:1.2rem;padding:14px 44px;border-radius:999px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
@keyframes pulse{50%{transform:scale(1.12)}}
@keyframes rise{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.stage,.stage.last #sTime{animation:none}.sf{transition:none}}
.sReps{display:inline-block;background:#fff;color:var(--h1);font-weight:800;font-size:1.6rem;padding:5px 22px;border-radius:999px;margin-top:8px}
.stage.done .sReps{color:#0b6b52}
.sNote{margin:0;opacity:.85;font-size:.9rem}
.sFig{height:clamp(110px,20vh,180px)}
.sRingW{width:clamp(170px,30vh,250px)}

:root{color-scheme:light;--bg:#e7d3b6;--card:#fbf4e8;--ink:#3a2a1c;--mute:#7b6550;--line:#d3bd9f;--tint:#f0e2cc;--acc:#8a5426;--accInk:#ffffff;--hot:#d9542a;--h1:#8b5a2b;--h2:#c4803c}
body{background:linear-gradient(180deg,#ecdcc4,#e2cdb0) fixed;background-color:var(--bg)}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.topbar h1{font-size:1.7rem}
.lg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px}
.lg button{background:transparent;color:var(--mute);padding:6px 13px;font-size:.85rem;border-radius:999px}
.lg button[aria-pressed="true"]{background:var(--acc);color:#fff}
.hero{box-shadow:0 12px 28px rgba(110,70,30,.3)}
.hero .sub{font-size:1.02rem;font-weight:700}
li{background:var(--card);box-shadow:0 5px 16px rgba(110,70,30,.12)}
li.next{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc),0 5px 16px rgba(110,70,30,.15)}
li .go{box-shadow:0 4px 12px rgba(110,70,30,.35)}
.stage{background:linear-gradient(160deg,var(--h1),var(--h2) 65%,#5a3515)}
.stage.done{background:linear-gradient(160deg,#16a06b,#0b6b52)}
.sGo{color:var(--h1)}
.sReps{color:var(--h1)}
.bnav{grid-template-columns:repeat(3,1fr)}
.bnav button{font-size:.76rem}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 5px 16px rgba(110,70,30,.12);margin-top:14px}
.qmeta{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;color:var(--mute);font-size:.9rem}
.lvt{padding:2px 10px;border-radius:999px;color:#fff;font-size:.75rem;font-weight:700}
.l0{background:#2dbf8a}.l1{background:#d99a14}.l2{background:var(--hot)}.l3{background:#6b3fa0}
.qq{font-family:Georgia,"Songti SC","Noto Serif CJK SC",serif;font-size:1.3rem;line-height:1.35;margin:4px 0 14px}
.opts{display:grid;gap:10px}
.opt{text-align:left;background:var(--tint);color:var(--ink);border:2px solid transparent;border-radius:14px;padding:13px 14px;font-weight:600;font-size:1rem}
.opt.ok{background:#d8f3e4;border-color:#2dbf8a;color:#14573d}
.opt.bad{background:#fde0d8;border-color:var(--hot);color:#8a2a10}
.opt:disabled{cursor:default}
.fb{margin:12px 0 0;font-weight:700}
.nextq{width:100%;margin-top:12px;background:var(--acc);color:#fff;padding:13px}
.score{font-family:Georgia,serif;font-size:4.6rem;text-align:center;line-height:1;margin:6px 0}
.rmsg{text-align:center;font-weight:700;font-size:1.15rem;margin:0 0 12px}
.rv{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line);font-size:.92rem}
.rv i{font-style:normal;font-weight:700;flex:none}
.rv small{display:block;color:var(--mute)}
.note{color:var(--mute);font-size:.88rem;margin:10px 0 0;text-align:center}
#pShare{background:#25d366;color:#fff}
.bnav{grid-template-columns:1fr 1.3fr 1fr;align-items:end}
.bnav .ctr span{display:flex;align-items:center;justify-content:center;width:62px;height:62px;border-radius:50%;background:var(--tint);font-size:2.1rem;margin-top:-34px;border:4px solid var(--card);box-shadow:0 6px 16px rgba(110,70,30,.3)}
.bnav .ctr[aria-pressed="true"] span{background:linear-gradient(135deg,var(--h1),var(--h2))}
.credit{text-align:center;color:#a8998a;font-size:.72rem;margin:26px 0 0}
.cf{display:flex;justify-content:flex-end;margin-top:8px}
.sw{background:var(--tint);color:var(--mute);padding:6px 12px;font-size:.85rem;font-weight:600}
.nextq.alt{background:var(--tint);color:var(--ink)}
.sCheck{position:absolute;inset:0;z-index:3;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:linear-gradient(160deg,#16a06b,#0b6b52);cursor:pointer}
.stage.done .sCheck{display:flex}
.sCheck svg{width:min(58vw,250px);height:auto;animation:pop .4s ease-out}
.sCheck circle{fill:rgba(255,255,255,.15);stroke:#fff;stroke-width:5}
.sCheck path{fill:none;stroke:#fff;stroke-width:9;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:80;stroke-dashoffset:80;animation:draw .5s .15s ease-out forwards}
.sCheck b{font-family:Georgia,serif;font-size:2.6rem;color:#fff}
@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.sCheck svg{animation:none}.sCheck path{animation:none;stroke-dashoffset:0}}
.cstat{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;background:var(--tint);border-radius:16px;padding:10px 14px;margin-bottom:10px}
.cstat b{font-family:Georgia,serif;font-size:2.2rem;line-height:1}
.cstat span{font-weight:700}
.cstat small{color:var(--mute);margin-left:auto}
</style>
</head>
<body>
<main>
<div class="topbar"><h1>Daily Tasks</h1><div class="lg" role="group" aria-label="Language"><button id="lEn" aria-pressed="true">EN</button><button id="lZh" aria-pressed="false">中文</button></div></div>
<div id="vToday">
<header class="hero">
<div><p class="sub" id="date"></p>
<div class="chips"><span class="chip">🔥 <b id="sStreak">0</b> day streak</span><span class="chip">Week <b id="sWeek">0</b></span><span class="chip">Month <b id="sMonth">0</b></span></div></div>
<div class="hr"><svg viewBox="0 0 86 86" aria-hidden="true"><circle class="rb" cx="43" cy="43" r="34" fill="none"/><circle class="hf" id="hRing" cx="43" cy="43" r="34" transform="rotate(-90 43 43)"/></svg><span id="sDone">0/3</span></div>
</header>
<div class="lvbox"><div class="lvh">Difficulty</div>
<div class="seg" id="lv" role="group" aria-label="Difficulty"><button data-l="easy">Easy</button><button data-l="medium" aria-pressed="true">Medium</button><button data-l="hard">Hard</button></div>
<p class="hint" id="lvTip"></p></div>
<h2>Today’s moves</h2>
<ul id="list"></ul>
<h2 id="bh">Bonus moves</h2>
<p class="hint" id="hint"></p>
<ul id="bonus"></ul>
<button class="more" id="more" hidden>Add another move</button>
<button class="reset" id="clear">Reset today</button>
</div>
<div id="vQuiz" hidden>
<header class="hero">
<div><p class="sub">Daily Quiz</p>
<div class="chips"><span class="chip">Correct today <b id="qToday">0</b></span><span class="chip">Correct total <b id="qTotal">0</b></span></div></div>
<div class="hr"><svg viewBox="0 0 86 86" aria-hidden="true"><circle class="rb" cx="43" cy="43" r="34" fill="none"/><circle class="hf" id="qRing" cx="43" cy="43" r="34" transform="rotate(-90 43 43)"/></svg><span id="qNum">0/10</span></div>
</header>
<div id="qbody"></div>
</div>
<div id="vProg" hidden>
<section class="card" style="margin-top:0">
<h2>Your progress</h2>
<div class="tabs"><button id="tabW" aria-pressed="true">This week</button><button id="tabM" aria-pressed="false">This month</button></div>
<p class="sum" id="sum"></p>
<div class="chart" id="chart"></div>
</section>
<section class="card">
<h2>Badges</h2>

function shuf(a,r){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(r()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}

 arr.forEach(function(q){var c=q.cat||"g";if(!g[c]){g[c]=[];keys.push(c)}g[c].push(q)});
 while(out.length<need&&keys.length){var k=keys[Math.floor(r()*keys.length)],a=g[k];out.push(a.splice(Math.floor(r()*a.length),1)[0]);if(!a.length)keys.splice(keys.indexOf(k),1)}
 return out;
}
function qpick(seen,n){
 seen=seen||[];n=n||0;var need=[2,3,3,2],ids=[],sn={};seen.forEach(function(x){sn[x]=1});
 for(var L=0;L<4;L++){
  var all=QB.filter(function(q){return q.lv===L}),pool=all.filter(function(q){return !sn[q.id]}),r=seed(key+"q"+L+n);
  if(pool.length<need[L])pool=all;
  var wr=pool.filter(function(q){return store.qs.w[q.k]}).sort(function(a,b){return store.qs.w[a.k]-store.qs.w[b.k]});
  var take=wr.slice(0,Math.max(1,Math.floor(need[L]/2)));
  if(take.length<need[L])take=take.concat(pickVaried(pool.filter(function(q){return !store.qs.c[q.k]&&!store.qs.w[q.k]}),need[L]-take.length,r));
  if(take.length<need[L])take=take.concat(pickVaried(pool.filter(function(q){return take.indexOf(q)<0}),need[L]-take.length,r));
  take.forEach(function(q){ids.push(q.id)});

}
